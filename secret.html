<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natalie's Secret</title>
    <link rel="icon" type="image/png" href="https://images.squarespace-cdn.com/content/v1/68d9654d0cba3d433908582a/607da867-b0da-49b7-b2d4-81282bc70b76/2021-03-03-05.16.png?format=1000w">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header>
    <h1>N.K. Hasselriis Portfolio</h1>
    <nav aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="notebook.html">Notes</a>
        <a href="secret.html" aria-current="page">Secret</a>
    </nav>
</header>
<main id="main-content">
    <section class="secret-section" aria-labelledby="secret-title">
        <p class="section-kicker">Behind the Curtain</p>
        <h2 id="secret-title">Secret</h2>
        <p class="section-intro">A little space reserved for something still in progress.</p>

        <article class="secret-feature-card" aria-label="Unrevealed project placeholder">
            <div class="secret-placeholder" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>
        </article>
    </section>
</main>

<div class="character-signoff toph-signoff" aria-label="A closing thought from Toph">
    <div class="character-divider" aria-hidden="true"><span>🪨</span><span class="divider-line"></span><span>🍈</span><span class="divider-line"></span><span>🪨</span></div>
    <blockquote class="character-note">
        <p>“I am not Toph. I am MELON LORD!”</p>
        <cite>— Toph</cite>
    </blockquote>
    <div class="character-mascot">
        <img src="assets/images/toph.png" alt="Illustration of Toph">
    </div>
</div>

<div class="secret-easter-egg-anchor">
    <button class="mountain-trigger" id="secret-tunnel-trigger" type="button" aria-label="Open the Secret Tunnel easter egg">⛰️</button>
</div>

<div class="secret-tunnel-popout" id="secret-tunnel-popout" aria-hidden="true">
    <p class="secret-tunnel-label">Secret Tunnel!</p>
    <img id="secret-tunnel-gif" src="assets/images/chong-secret-tunnel.gif" alt="Chong playing music in the Secret Tunnel scene">
</div>

<footer><p>© 2026 Natalie Hasselriis</p></footer>
<script>
(() => {
    const trigger = document.getElementById('secret-tunnel-trigger');
    const popout = document.getElementById('secret-tunnel-popout');
    const gif = document.getElementById('secret-tunnel-gif');
    if (!trigger || !popout || !gif) return;

    const gifSrc = gif.getAttribute('src');

    const playSecretTunnel = () => {
        popout.classList.remove('is-playing');
        popout.setAttribute('aria-hidden', 'false');

        // Reload the GIF so each click begins the animation from its first frame.
        gif.removeAttribute('src');
        void popout.offsetWidth;
        gif.setAttribute('src', gifSrc);
        popout.classList.add('is-playing');
    };

    trigger.addEventListener('click', playSecretTunnel);

    popout.addEventListener('animationend', () => {
        popout.classList.remove('is-playing');
        popout.setAttribute('aria-hidden', 'true');
    });
})();
</script>
</body>
</html>
